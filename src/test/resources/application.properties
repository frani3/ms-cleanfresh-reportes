# Base H2 en memoria para las pruebas. Es .properties (y no .yaml) para sumarse al application.yaml principal en vez de reemplazarlo.
spring.datasource.url=jdbc:h2:mem:reportes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
